name: Deploy to server

# Deploys on every push to main. The heavy lifting (git pull + npm ci +
# build + pm2 reload) runs on the server via /var/www/wardeh-portfolio/deploy.sh
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: /var/www/wardeh-portfolio/deploy.sh
